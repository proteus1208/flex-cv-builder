<body>
    <div id="app">Loading…</div>
    <script src="_framework/blazor.webview.js"></script>
    <script>
      window.cvSyncJsonScroll = function (el) {
        if (!el) return;
        var pre = el.previousElementSibling;
        if (pre) {
          pre.scrollTop = el.scrollTop;
          pre.scrollLeft = el.scrollLeft;
        }
      };
    </script>
